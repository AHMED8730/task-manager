<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To Do Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <div>
                <p class="eyebrow">PRODUCTIVITY APP</p>
                <h1>Task<span>Flow</span></h1>
                <p class="subtitle">Organize your day, one task at a time.</p>
            </div>

            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>

        <section class="stats">
            <div class="stat-card">
                <strong id="totalCount">0</strong>
                <span>Total</span>
            </div>

            <div class="stat-card">
                <strong id="activeCount">0</strong>
                <span>Active</span>
            </div>

            <div class="stat-card">
                <strong id="doneCount">0</strong>
                <span>Completed</span>
            </div>
        </section>

        <section class="input-area">
            <input
                id="taskInput"
                type="text"
                placeholder="What needs to be done?"
                maxlength="100"
            >

            <button id="addBtn">+ Add Task</button>
        </section>

        <div class="toolbar">

            <div class="filters">
                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>
            </div>

            <button id="clearBtn" class="clear-btn">
                Clear completed
            </button>

        </div>

        <ul id="taskList"></ul>

        <div id="emptyState" class="empty">
            <div class="empty-icon">✨</div>
            <h2>No tasks yet</h2>
            <p>Add something you want to accomplish today.</p>
        </div>

        <footer>
            TaskFlow • Your tasks are saved automatically
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
